name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # -backend=false because this is a module, not a root configuration:
      # there is no state to reach and no credentials to hold. It still
      # resolves the provider constraints, which is exactly what a provider
      # version bump changes.
      - name: Init (providers only)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # Reported, not gated. Four files in the tree are not `terraform fmt`
      # clean already, and gating on that would make this lane red on arrival
      # for a reason that has nothing to do with the change under review.
      - name: fmt (advisory)
        continue-on-error: true
        run: terraform fmt -check -recursive -diff
